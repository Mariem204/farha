<style>
body{margin:0}
a{color:#C9A15C}a:hover{color:#e3c27f}
.hn *{box-sizing:border-box}
.ruq{font-family:'Aref Ruqaa',serif}
.ami{font-family:'Amiri',serif}
.lat{font-family:'Cormorant Garamond',serif}
.gold{background:linear-gradient(180deg,#f6e1a8 0%,#d9b46c 45%,#C9A15C 60%,#9b7438 100%);-webkit-background-clip:text;background-clip:text;color:transparent}

/* scroller: one continuous royal backdrop */
.scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;opacity:0;transition:opacity 1.3s ease;scrollbar-width:none;z-index:1;scroll-behavior:smooth;
background:linear-gradient(180deg,#2a0b13 0%,#4a1420 7%,#641D2C 17%,#4b1a2b 24%,#23365A 31%,#23365A 45%,#2b2638 51%,#34221D 57%,#34221D 70%,#4e1726 80%,#641D2C 90%,#2a0b13 100%);background-size:100% 3376px;background-attachment:local}
.scroller::-webkit-scrollbar{display:none}
.scroller.on{opacity:1}
.scene{position:relative;height:844px;overflow:visible}

/* reveals */
.rv>*{opacity:0;transform:translateY(18px);transition:opacity 1.1s ease,transform 1.3s cubic-bezier(.2,.8,.2,1)}
.rv.on>*{opacity:1;transform:none}
.rv.on>*:nth-child(2){transition-delay:.2s}
.rv.on>*:nth-child(3){transition-delay:.4s}
.rv.on>*:nth-child(4){transition-delay:.6s}
.rv.on>*:nth-child(5){transition-delay:.8s}
.rv.on>*:nth-child(6){transition-delay:1s}
.thr{opacity:0;transform:translateY(46px) scale(.86);filter:blur(6px);transition:opacity 1.4s ease .5s,transform 1.8s cubic-bezier(.2,.8,.2,1) .5s,filter 1.4s ease .5s}
.on .thr{opacity:1;transform:none;filter:blur(0)}
.frm{opacity:0;transform:translateY(-20px) scale(.92);transition:opacity 1.2s ease,transform 1.6s cubic-bezier(.2,.8,.2,1)}
.on .frm{opacity:1;transform:none}
.wr{clip-path:inset(-30% -6% -40% 100%);transition:clip-path 2s cubic-bezier(.6,0,.2,1) 1s}
.on .wr{clip-path:inset(-30% -6% -40% -6%)}
.pop{opacity:0;transform:translateY(30px) rotate(var(--r,0deg)) scale(.92);transition:opacity 1.2s ease,transform 1.6s cubic-bezier(.2,.8,.2,1)}
.on .pop{opacity:1;transform:rotate(var(--r,0deg))}
.on .pop.d2{transition-delay:.25s}
.on .pop.d3{transition-delay:.5s}

/* intro */
.intro{position:absolute;inset:0;z-index:5;overflow:hidden}
.introBg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 38%,#7a2536 0%,#4a1420 45%,#22080f 100%);transition:opacity 1.1s ease}
.intro.reveal .introBg{opacity:0}
.intro.reveal{pointer-events:none}
.lant{transition:transform 1.5s cubic-bezier(.6,0,.35,1)}
.intro.open .lant{transform:translateY(-560px)}
.rug{transition:opacity 1s ease}
.intro.open .rug{opacity:0}
.rugIn{animation:unroll 2.6s cubic-bezier(.5,0,.2,1) .3s both}
@keyframes unroll{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
.ttlIn{animation:write 2.2s cubic-bezier(.6,0,.2,1) 1.4s both}
@keyframes write{from{clip-path:inset(-30% -6% -40% 100%)}to{clip-path:inset(-30% -6% -40% -6%)}}
.cocoIn{animation:thrIn 1.8s cubic-bezier(.2,.8,.2,1) .7s both}
@keyframes thrIn{from{opacity:0;transform:translateY(40px) scale(.86);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
.ci{animation:ciIn 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes ciIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.copy{transition:opacity .7s ease,transform 1.2s cubic-bezier(.6,0,.35,1)}
.intro.open .copy{opacity:0;transform:scale(1.12)}
.flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(255,226,160,.85),rgba(255,226,160,0) 60%);opacity:0;pointer-events:none}
.intro.open .flash{animation:flash 1.6s ease .5s both}
@keyframes flash{0%{opacity:0}45%{opacity:1}100%{opacity:0}}

/* ambient */
.swing{animation:swing 5.5s ease-in-out infinite;transform-origin:50% 0}
.swing2{animation:swing 6.5s ease-in-out -2s infinite;transform-origin:50% 0}
@keyframes swing{0%,100%{rotate:-2.6deg}50%{rotate:2.6deg}}
.glow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,206,110,.75) 0%,rgba(255,170,60,.25) 40%,rgba(255,170,60,0) 70%);mix-blend-mode:screen;animation:flick 3.2s infinite}
@keyframes flick{0%,100%{opacity:.85;transform:scale(1)}18%{opacity:.7;transform:scale(.96)}22%{opacity:.95;transform:scale(1.03)}47%{opacity:.78}52%{opacity:.92;transform:scale(1.02)}76%{opacity:.72;transform:scale(.97)}}
.hover{animation:hover 6s ease-in-out infinite}
@keyframes hover{0%,100%{translate:0 0}50%{translate:0 -8px}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.1)}}

/* particles */
.fx{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.pa{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;background:#f3d79a;box-shadow:0 0 8px 2px rgba(243,215,154,.6);animation:rise 14s linear infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:.9}50%{transform:translate(14px,-430px);opacity:.7}90%{opacity:.5}100%{transform:translate(-8px,-880px);opacity:0}}

/* buttons */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 30px;border-radius:999px;cursor:pointer;text-decoration:none;font-family:'Amiri',serif;font-size:18px;font-weight:700;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(201,161,92,.35)}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:2px solid #f6e1a8;outline-offset:3px}
.btn::after{content:"";position:absolute;top:0;right:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,240,200,.5),transparent);transform:skewX(-20deg);animation:shine 4.8s ease-in-out infinite}
@keyframes shine{0%,70%{right:-60%}100%{right:130%}}
.btnGold{background:linear-gradient(180deg,#e3c47f,#C9A15C 55%,#a8813f);color:#34221D;border:0}
.btnLine{background:rgba(201,161,92,.08);color:#f2d9a0;border:1px solid #C9A15C}

/* nav */
.dots{position:absolute;left:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px;z-index:3}
.dot{width:24px;height:24px;border:0;background:transparent;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dot span{width:7px;height:7px;transform:rotate(45deg);background:rgba(248,240,227,.35);transition:transform .3s,background-color .3s}
.dot.act span{background:#C9A15C;transform:rotate(45deg) scale(1.4)}
.dot:focus-visible{outline:2px solid #C9A15C}

/* form */
.fld{display:flex;flex-direction:column;gap:6px}
.lbl{font-family:'Amiri',serif;font-size:15px;font-weight:700;color:#f2d9a0}
.inp{width:100%;height:46px;border:1px solid rgba(201,161,92,.55);border-radius:12px;background:rgba(248,240,227,.95);padding:0 14px;font-family:'Amiri',serif;font-size:17px;color:#34221D;transition:border-color .25s,box-shadow .25s}
.inp:focus{outline:none;border-color:#C9A15C;box-shadow:0 0 0 3px rgba(201,161,92,.35)}
.inp.bad{border-color:#ff9a8a;box-shadow:0 0 0 2px rgba(255,154,138,.35)}
.err{font-family:'Amiri',serif;font-size:14px;color:#ffc2b8;margin:0}
.seg{flex:1;min-height:46px;border:1px solid rgba(201,161,92,.55);background:rgba(248,240,227,.06);border-radius:12px;font-family:'Amiri',serif;font-size:16px;color:#F8F0E3;cursor:pointer;transition:all .25s}
.seg:hover{border-color:#C9A15C}
.seg.sel{background:#C9A15C;border-color:#C9A15C;color:#34221D;font-weight:700}
.seg:focus-visible{outline:2px solid #f6e1a8;outline-offset:2px}
.linkbtn{background:none;border:0;cursor:pointer;font-family:'Amiri',serif;font-size:14px;color:#C9A15C;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 10px}

/* reduced motion */
.rm *, .rm *::after{animation:none !important;transition-duration:.01ms !important;transition-delay:0s !important}
@media (prefers-reduced-motion: reduce){.hn *, .hn *::after{animation:none !important;transition-duration:.01ms !important;transition-delay:0s !important}}
.rm .fx .pa{display:none}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#2a0b13}
#root{position:absolute!important;left:50%;top:50%;transform-origin:50% 50%;transform:translate(-50%,-50%) scale(var(--fit,1))}
</style>

    try { parent.postMessage({ type: 'farha:rsvp', id: id, name: n, attending: true, kind: 'mot', message: m.slice(0, 560) }, '*'); } catch (e) {}
    setTimeout(function () { finish(true); }, 15000);
  });
})();

</script>
