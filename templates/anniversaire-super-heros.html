body{margin:0;background:#101D3A;overflow-x:hidden}
*{box-sizing:border-box}
a{color:#0057B8}a:hover{color:#E62429}
img{max-width:none}
.comic{font-family:'Bangers','Impact',sans-serif;font-weight:400;letter-spacing:.04em}
.stroke{-webkit-text-stroke:2px #111;paint-order:stroke fill}
button:focus-visible,a:focus-visible,input:focus,textarea:focus{outline:3px solid #E62429;outline-offset:3px}

/* ===== ÉCRAN 1 : l'enveloppe ===== */
.gate{position:relative;height:100vh;height:100svh;min-height:600px;max-height:980px;max-width:480px;margin:0 auto;overflow:hidden;background:#101D3A;container-type:size}
.gate-fill{position:absolute;left:-40px;top:-40px;width:calc(100% + 80px);height:calc(100% + 80px);object-fit:cover;filter:blur(18px) brightness(.7) saturate(1.15)}
.stage{position:absolute;left:50%;bottom:0;width:max(100cqw,min(56.34cqh,118cqw));aspect-ratio:640/1136;transform:translateX(-50%);transform-origin:50% 34%;transition:transform .75s cubic-bezier(.6,0,.3,1)}
.layer{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.env-glow{position:absolute;left:0;width:100%;top:34%;height:54%;background:radial-gradient(ellipse at 50% 50%,rgba(255,255,255,.38) 0%,rgba(255,255,255,0) 62%);animation:glow 4s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
.env-shadow{position:absolute;left:9%;width:83%;top:79.4%;height:3.8%;border-radius:50%;background:radial-gradient(ellipse at 50% 50%,rgba(5,8,20,.85) 0%,rgba(5,8,20,0) 70%);animation:shadow 4s ease-in-out infinite}
@keyframes shadow{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(.88);opacity:.7}}
.env-float{position:absolute;left:0;top:0;width:100%;height:100%;perspective:1400px;perspective-origin:50% 40%;animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.1%)}}
.opening .env-float{animation:pop .5s ease 1 both}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.035)}70%{transform:scale(.995)}100%{transform:scale(1)}}
.env-inside{clip-path:polygon(8.6% 40.9%,92.3% 40.9%,92.3% 50.3%,50.3% 61.2%,8.6% 52.1%);background:linear-gradient(180deg,#060E24 0%,#14306A 100%);opacity:0;transition:opacity .15s ease .45s;z-index:1}
.opening .env-inside{opacity:1}
.peek{position:absolute;left:14%;width:72%;top:44%;height:28%;z-index:3;overflow:hidden;background:#fff;border:3px solid #111;border-radius:6px;box-shadow:0 -6px 18px rgba(0,0,0,.35);opacity:0;transform:translateY(0);transition:opacity .05s linear .82s,transform 1s cubic-bezier(.3,1.35,.5,1) 1.2s;display:flex;flex-direction:column;align-items:center;padding-top:3%}
.opening .peek{opacity:1;transform:translateY(-60%)}
.peek-tex{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;opacity:.35}
.env-body{z-index:4;clip-path:polygon(8.3% 51.9%,50.3% 60.9%,92.6% 50.1%,92.6% 81.2%,8.3% 81.2%)}
.flap{position:absolute;left:0;top:0;width:100%;height:100%;z-index:5;transform-origin:50% 40.6%;transform-style:preserve-3d;transition:transform .95s cubic-bezier(.55,0,.3,1) .4s,z-index 0s linear .85s}
.opening .flap{transform:rotateX(178deg);z-index:2}
.flap-front{clip-path:polygon(8.3% 40.6%,92.6% 40.6%,92.6% 50.1%,50.3% 60.9%,8.3% 51.9%);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flap-back{position:absolute;left:0;top:0;width:100%;height:100%;clip-path:polygon(8.3% 40.6%,92.6% 40.6%,92.6% 31.1%,50.3% 20.3%,8.3% 29.3%);transform-origin:50% 40.6%;transform:rotateX(180deg);backface-visibility:hidden;-webkit-backface-visibility:hidden;background:linear-gradient(0deg,#9E1217 0%,#E62429 70%,#F25A5E 100%)}
.leaving .stage{transform:translateX(-50%) scale(2.2)}
.flash{position:absolute;left:0;top:0;width:100%;height:100%;z-index:10;background:#fff;opacity:0;pointer-events:none;transition:opacity .4s ease .2s;display:flex;align-items:center;justify-content:center}
.leaving .flash{opacity:1}
.flash-word{transform:scale(.4) rotate(-8deg);opacity:0;transition:transform .45s cubic-bezier(.3,1.6,.5,1) .3s,opacity .2s .3s}
.leaving .flash-word{transform:scale(1) rotate(-8deg);opacity:1}
.gate-top,.gate-cta{position:absolute;left:0;right:0;z-index:6;text-align:center;transition:opacity .35s ease,transform .35s ease}
.gate-top{top:0;padding:5cqh 5% 0}
.gate-cta{bottom:0;padding:0 6% 3.6cqh;display:flex;flex-direction:column;align-items:center;gap:8px}
.opening .gate-top{animation:flyAway .55s cubic-bezier(.5,-0.4,.8,.4) both;pointer-events:none}
@keyframes flyAway{0%{opacity:1;transform:none}25%{opacity:1;transform:translateY(8px) scale(1.04) rotate(1deg)}100%{opacity:0;transform:translateY(-130%) scale(.7) rotate(-6deg)}}
.opening .gate-cta{animation:dropAway .45s ease-in both;pointer-events:none}
@keyframes dropAway{to{opacity:0;transform:translateY(140%)}}
.drop-in{animation:dropIn .9s cubic-bezier(.3,1.4,.5,1) .2s both}
@keyframes dropIn{from{opacity:0;transform:translateY(-40px) scale(.9)}to{opacity:1;transform:none}}

/* ===== Boutons ===== */
.btn-hero{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:58px;padding:10px 26px;border:3px solid #111;border-radius:14px;background:#E62429;color:#fff;font-family:'Bangers','Impact',sans-serif;font-size:26px;letter-spacing:.06em;line-height:1.05;text-decoration:none;cursor:pointer;box-shadow:5px 5px 0 #111;transition:transform .15s ease,box-shadow .15s ease,filter .15s ease;-webkit-tap-highlight-color:transparent}
.btn-hero:hover{filter:brightness(1.07);transform:translate(-1px,-1px);box-shadow:6px 6px 0 #111;color:#fff}
.btn-hero:active{transform:translate(4px,4px) scale(.98);box-shadow:1px 1px 0 #111}
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:5px 5px 0 #111,0 0 0 0 rgba(230,36,41,.6)}50%{box-shadow:5px 5px 0 #111,0 0 0 16px rgba(230,36,41,0)}}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 18px;border:3px solid #111;border-radius:12px;background:#fff;color:#101D3A;font-family:'Bangers','Impact',sans-serif;font-size:20px;letter-spacing:.06em;text-decoration:none;box-shadow:4px 4px 0 #111;transition:transform .15s ease,box-shadow .15s ease}
.btn-ghost:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 #111;color:#101D3A}
.btn-ghost:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #111}
.choice{min-height:54px;padding:6px 10px;border:3px solid #111;border-radius:12px;background:#fff;color:#101D3A;font-family:'Bangers','Impact',sans-serif;font-size:21px;letter-spacing:.05em;cursor:pointer;box-shadow:3px 3px 0 #111;transition:transform .15s ease,background .15s ease}
.choice:active{transform:translate(2px,2px)}
.choice-yes.on{background:#E62429;color:#fff}
.choice-no.on{background:#101D3A;color:#fff}

/* ===== ÉCRAN 2 : la carte ===== */
.main{position:relative;max-width:480px;margin:0 auto;overflow:hidden;background:#fff;container-type:inline-size}
.hero{position:relative;width:100%;aspect-ratio:900/1600;overflow:hidden;background:#F2F2F2;animation:cardIn 1s cubic-bezier(.2,.9,.25,1) both}
@keyframes cardIn{from{opacity:0;transform:scale(1.12)}to{opacity:1;transform:none}}
.hero-bg{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;animation:ken 16s ease-in-out infinite alternate;transform-origin:50% 30%}
@keyframes ken{from{transform:scale(1)}to{transform:scale(1.045)}}
.hero-col{position:absolute;left:13%;right:13%;top:34.5%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2.6cqw}
.tag{display:inline-block;padding:1cqw 3.2cqw;border:3px solid #111;border-radius:8px;background:#E62429;color:#fff;box-shadow:4px 4px 0 #111}
.name{margin:0;color:#E62429;line-height:.9;-webkit-text-stroke:.55cqw #111;paint-order:stroke fill;text-shadow:.9cqw .9cqw 0 #0057B8,1.7cqw 1.7cqw 0 #111}
.age-row{display:flex;align-items:center;justify-content:center;gap:2.2cqw;color:#101D3A}
.burst{position:relative;width:21cqw;height:21cqw;display:flex;align-items:center;justify-content:center;background:#111;clip-path:polygon(50% 0%,61% 18%,80% 8%,79% 29%,100% 32%,86% 50%,100% 68%,79% 71%,80% 92%,61% 82%,50% 100%,39% 82%,20% 92%,21% 71%,0% 68%,14% 50%,0% 32%,21% 29%,20% 8%,39% 18%)}
.burst-in{position:absolute;left:1.2cqw;top:1.2cqw;right:1.2cqw;bottom:1.2cqw;background:#0057B8;clip-path:inherit;display:flex;align-items:center;justify-content:center}
.spin-in{animation:spinIn .9s cubic-bezier(.3,1.5,.5,1) 1.1s both}
@keyframes spinIn{from{opacity:0;transform:scale(.2) rotate(-90deg)}to{opacity:1;transform:none}}
.bubble{position:relative;margin-top:2.4cqw;padding:3.4cqw 4.4cqw;border:.7cqw solid #111;border-radius:6cqw;background:#fff;box-shadow:1.3cqw 1.3cqw 0 #111;color:#101D3A;font-family:'Nunito',system-ui,sans-serif;font-weight:800;font-size:clamp(14px,3.9cqw,19px);line-height:1.38}
.bubble::before{content:'';position:absolute;left:50%;top:-4.2cqw;margin-left:-3cqw;border:3cqw solid transparent;border-bottom:4.2cqw solid #111;border-top:0}
.bubble::after{content:'';position:absolute;left:50%;top:-2.9cqw;margin-left:-2cqw;border:2cqw solid transparent;border-bottom:3cqw solid #fff;border-top:0}
.cue{position:absolute;left:50%;bottom:2.4%;transform:translateX(-50%);z-index:3}
.bob{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

.thread{position:absolute;left:77.5%;top:0;width:4px;margin-left:-2px;height:15cqw;background:#fff;border-left:1.2px solid #111;border-right:1.2px solid #111}
.panel{position:relative;background:#fff;border:3px solid #111;border-radius:12px;box-shadow:6px 6px 0 #101D3A;padding:30px 14px 14px}
.panel::after{content:'';position:absolute;right:0;bottom:0;width:62%;height:75%;border-radius:0 0 9px 0;background-image:radial-gradient(circle,rgba(0,87,184,.25) 1.4px,transparent 1.8px);background-size:9px 9px;-webkit-mask-image:linear-gradient(135deg,transparent 35%,#000 100%);mask-image:linear-gradient(135deg,transparent 35%,#000 100%);pointer-events:none}
.panel-tab{position:absolute;left:12px;top:-17px;display:inline-flex;align-items:center;gap:6px;padding:2px 10px 1px;border:3px solid #111;border-radius:7px;background:#E62429;color:#fff;font-family:'Bangers','Impact',sans-serif;font-size:20px;letter-spacing:.07em;transform:rotate(-3deg);z-index:1}
.panel-tab.blue{background:#0057B8}
.val{position:relative;z-index:1;margin:0;font-family:'Nunito',system-ui,sans-serif;font-weight:900;font-size:20px;line-height:1.25;color:#101D3A}
.sub{position:relative;z-index:1;margin:4px 0 0;font-family:'Nunito',system-ui,sans-serif;font-weight:700;font-size:15px;line-height:1.4;color:#33415E}
.reveal{animation:fadeUp .9s cubic-bezier(.2,.8,.2,1) both}
.d1{animation-delay:.25s}.d2{animation-delay:.45s}.d3{animation-delay:.65s}.d4{animation-delay:.85s}.d5{animation-delay:1.05s}
@keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.count{position:relative;margin-top:34px;padding:22px 14px 22px;border:3px solid #111;border-radius:14px;background:#101D3A;box-shadow:6px 6px 0 #E62429;text-align:center;overflow:hidden}
.count-dots{position:absolute;left:0;top:0;width:100%;height:100%;background-image:radial-gradient(circle,rgba(255,255,255,.09) 1.4px,transparent 1.8px);background-size:10px 10px;pointer-events:none}
.cell{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px 8px;border:3px solid #111;border-radius:10px;background:#0057B8;box-shadow:3px 3px 0 #111}
.balloon{position:absolute;width:24%;z-index:2;pointer-events:none;animation:floaty 5s ease-in-out infinite alternate}
.balloon.r{animation-duration:6s;animation-delay:-2s}
@keyframes floaty{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-16px) rotate(3deg)}}
.slot{display:flex;align-items:center;justify-content:center;border:2px dashed #0057B8;border-radius:14px;background:rgba(255,255,255,.75);color:#0057B8;font-family:'Nunito',system-ui,sans-serif;font-weight:800;font-size:13px;text-align:center;padding:8px}

.map-frame{position:relative;z-index:1;display:block;margin-top:12px;border:3px solid #111;border-radius:10px;overflow:hidden;background:#EAF0FA;box-shadow:4px 4px 0 #0057B8;text-decoration:none;transition:transform .15s ease}
.map-frame:active{transform:translate(2px,2px)}
.map-pin{position:absolute;left:8px;top:8px;display:inline-flex;align-items:center;gap:5px;padding:3px 9px 2px;border:3px solid #111;border-radius:7px;background:#E62429;color:#fff;font-size:17px;transform:rotate(-3deg);box-shadow:2px 2px 0 #111}
.parent-line{display:flex;align-items:baseline;justify-content:space-between;gap:10px;min-height:44px;padding:6px 0;border-bottom:2px dashed rgba(16,29,58,.25);text-decoration:none}
.parent-line:last-child{border-bottom:0}
.dress{position:relative;padding:50px 16px 54px;background:#fff;text-align:center;border-top:3px solid #111}
.swatch{width:58px;height:58px;border-radius:50%;border:3px solid #111;box-shadow:inset 0 -7px 0 rgba(0,0,0,.18),inset 0 5px 0 rgba(255,255,255,.35),4px 4px 0 #101D3A;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.swatch:hover{transform:translateY(-5px) rotate(-6deg)}

/* ===== Confirmation ===== */
.rsvp{position:relative;padding:58px 18px 54px;background:#0057B8;overflow:hidden}
.rsvp-dots{position:absolute;left:0;top:0;width:100%;height:100%;background-image:radial-gradient(circle,rgba(16,29,58,.35) 1.6px,transparent 2px);background-size:11px 11px;pointer-events:none}
.sheet{position:relative;padding:34px 18px 22px;border:3px solid #111;border-radius:16px;background:#fff;box-shadow:7px 7px 0 #111}
.sticker-mask{position:absolute;left:-14px;top:-46px;width:92px;transform:rotate(-10deg);filter:drop-shadow(3px 4px 0 rgba(0,0,0,.35));animation:stickIn .7s cubic-bezier(.3,1.6,.5,1) .3s both;z-index:2}
@keyframes stickIn{from{opacity:0;transform:scale(.3) rotate(-30deg)}to{opacity:1;transform:rotate(-10deg)}}
.sticker-hand{position:absolute;right:-10px;top:-56px;width:74px;transform:rotate(14deg);filter:drop-shadow(2px 3px 0 rgba(0,0,0,.3));transform-origin:50% 90%;animation:wave 2.4s ease-in-out infinite;z-index:2;pointer-events:none}
@keyframes wave{0%,60%,100%{transform:rotate(14deg)}70%{transform:rotate(2deg)}80%{transform:rotate(20deg)}90%{transform:rotate(8deg)}}
.field{display:flex;flex-direction:column;gap:6px;text-align:left}
.field label{font-family:'Bangers','Impact',sans-serif;font-size:19px;letter-spacing:.06em;color:#101D3A}
.inp{width:100%;min-height:50px;padding:10px 14px;border:3px solid #111;border-radius:10px;background:#F6F8FC;color:#111;font-family:'Nunito',system-ui,sans-serif;font-weight:700;font-size:16px}
.ok-box{margin-top:16px;padding:14px;border:3px solid #111;border-radius:12px;background:#FFF;box-shadow:4px 4px 0 #0057B8;text-align:center}

@media (prefers-reduced-motion:reduce){
  .env-glow,.env-shadow,.env-float,.opening .env-float,.pulse,.drop-in,.hero,.hero-bg,.spin-in,.bob,.web-corner,.dangle,.swing,.reveal,.balloon,.sticker-mask,.sticker-hand{animation:none!important}
  .opening .gate-top,.opening .gate-cta{animation:none!important;opacity:0}
  .stage,.flap,.peek,.env-inside,.flash,.flash-word,.gate-top,.gate-cta,.btn-hero,.btn-ghost{transition:none!important}
}
[hidden]{display:none!important}
.map-frame iframe{display:block;width:100%;height:190px;border:0;pointer-events:none}
.rsvp-err{margin:0;font-weight:900;font-size:15px;color:#B3161C}

</style>
</head>

  var W = { child: C.name, age: C.age, venue: C.venue, address: C.address, timeNote: C.timeNote,

    time: pad(start.getHours()) + 'h' + pad(start.getMinutes()) };
  all('[data-w]').forEach(function (el) { var v = W[el.getAttribute('data-w')]; if (v != null) el.textContent = v; });
  all('[data-t]').forEach(function (el) { var k = el.getAttribute('data-t'), v = C[k] != null ? C[k] : FIXED[k]; if (v != null) el.textContent = v; });
  var len = String(C.name).length;
  all('[data-namesize="hero"]').forEach(function (el) { el.style.fontSize = len <= 5 ? '19cqw' : len <= 8 ? '15cqw' : len <= 11 ? '11.5cqw' : '9cqw'; });
  all('[data-namesize="peek"]').forEach(function (el) { el.style.fontSize = len <= 5 ? '14cqw' : len <= 8 ? '10.5cqw' : '7.5cqw'; });

  // lieu : itinéraire, carte intégrée, agenda
  var place = [C.venue, C.address].filter(Boolean).join(', '), q = C.mapQuery || place;
  var maps = /^https:\/\//.test(C.mapLink || '') ? C.mapLink : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
  all('[data-maps]').forEach(function (a) { a.href = maps; a.target = '_blank'; a.rel = 'noopener'; });
  var mf = $('#mapEmbed'); if (mf) mf.src = 'https://maps.google.com/maps?q=' + encodeURIComponent(q) + '&z=15&output=embed';
  $('#calLink').href = 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent('Anniversaire de ' + C.name + ' (' + C.age + ' ans)') +
    '&dates=' + stamp(start) + '/' + stamp(end) + '&location=' + encodeURIComponent(place);

  // numéros des parents (ligne masquée si le numéro est vide)
  [1, 2].forEach(function (i) {
    var a = $('[data-parent="' + i + '"]'); if (!a) return;
    var num = String(C['parent' + i + 'Phone'] || '').trim();
    if (!num) { a.hidden = true; return; }
    a.querySelector('.sub').textContent = C['parent' + i + 'Label'] || '';
    a.querySelector('.val').textContent = num;
    a.href = 'tel:' + num.replace(/[^\d+]/g, '');
  });

  // dress code
  var sw = all('#swatches .swatch'), nm = all('#swatches [data-dress-name]');
  (C.dress || []).forEach(function (d, i) {
    var hex = Array.isArray(d) ? d[0] : d, name = Array.isArray(d) ? d[1] : '';
    if (sw[i]) sw[i].style.background = hex;
    if (nm[i] && name) nm[i].textContent = name;
  });

  // compte à rebours
  var cd = {}; all('[data-cd]').forEach(function (el) { cd[el.getAttribute('data-cd')] = el; });
  function tick() {
    var diff = Math.max(0, start.getTime() - Date.now());
    cd.d.textContent = String(Math.floor(diff / 864e5)); cd.h.textContent = pad(Math.floor(diff / 36e5) % 24);
    cd.m.textContent = pad(Math.floor(diff / 6e4) % 60); cd.s.textContent = pad(Math.floor(diff / 1e3) % 60);
  }
  tick(); setInterval(tick, 1000);

  // enveloppe : ouverture puis invitation
  var gate = $('#gate'), main = $('#content'), timers = [], phase = 'closed';
  var reduce = false; try { reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  $('#openMission').addEventListener('click', function () {
    if (phase !== 'closed') return; phase = 'opening'; gate.classList.add('opening');
    timers.push(setTimeout(function () { gate.classList.add('leaving'); }, reduce ? 60 : 2350));
    timers.push(setTimeout(function () { phase = 'open'; gate.hidden = true; main.hidden = false; try { scrollTo(0, 0); } catch (e) {} }, reduce ? 120 : 3050));
  });
  $('#replay').addEventListener('click', function () {
    timers.forEach(clearTimeout); timers = []; phase = 'closed';
    gate.classList.remove('opening', 'leaving'); gate.hidden = false; main.hidden = true; try { scrollTo(0, 0); } catch (e) {}
  });

  // confirmation : envoyée au site Farha, qui l'enregistre et l'envoie par e-mail aux parents
  var rsvp = null, sent = false, yes = $('#sayYes'), no = $('#sayNo'), err = $('#rsvpErr'), btn = $('#sendBtn');
  function setErr(t) { err.textContent = t; err.hidden = !t; }
  function choose(v) {
    rsvp = v; setErr('');
    yes.classList.toggle('on', v === 'yes'); yes.setAttribute('aria-pressed', v === 'yes');
    no.classList.toggle('on', v === 'no'); no.setAttribute('aria-pressed', v === 'no');
    btn.querySelector('span').textContent = v === 'no' ? FIXED.sendNo : FIXED.sendYes;
  }
  yes.addEventListener('click', function () { choose('yes'); });
  no.addEventListener('click', function () { choose('no'); });
  $('#f-name').addEventListener('input', function () { setErr(''); });
  btn.addEventListener('click', function () {
    if (sent) return;
    if (!rsvp) { setErr("Choisis d'abord ta réponse : oui ou non ?"); return; }
    var name = $('#f-name').value.trim();
    if (name.length < 2) { setErr("N'oublie pas d'écrire ton nom et ton prénom !"); return; }
    var id = Math.random().toString(36).slice(2), done = false, label = btn.querySelector('span').textContent;
    btn.disabled = true; btn.querySelector('span').textContent = 'Envoi…';
    function finish(ok, msg) {
      if (done) return; done = true; removeEventListener('message', on);
      if (ok) { sent = true; $('#okTitle').textContent = (rsvp === 'no' ? FIXED.okNo : FIXED.okYes) + name + ' !'; $('#okBox').hidden = false; btn.querySelector('span').textContent = '✓ Réponse envoyée'; }
      else { btn.disabled = false; btn.querySelector('span').textContent = label; setErr(msg || "La réponse n'a pas pu être envoyée. Réessaie."); }
    }
    function on(e) { var m = e.data; if (m && m.type === 'farha:rsvp-result' && m.id === id) finish(m.ok, m.error); }
    addEventListener('message', on);
    if (window.parent === window) { finish(true); return; }
    try { parent.postMessage({ type: 'farha:rsvp', id: id, name: name, attending: rsvp === 'yes', message: $('#f-msg').value.trim().slice(0, 600) }, '*'); } catch (e) {}
    setTimeout(function () { finish(true); }, 15000);
  });
})();
