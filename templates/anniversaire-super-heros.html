/* ===== ÉCRAN 1 : l'enveloppe ===== */

@media (prefers-reduced-motion:reduce){

  .opening .gate-top,.opening .gate-cta{animation:none!important;opacity:0}
  .stage,.flap,.peek,.env-inside,.flash,.flash-word,.gate-top,.gate-cta,.btn-hero,.btn-ghost{transition:none!important}
}
[hidden]{display:none!important}

<div style="min-height: 100vh; background: #101D3A; font-family: 'Nunito', system-ui, sans-serif; color: #111111" data-canvas-width="430" data-canvas-height="932" data-document-role="page" data-label="Page 1 : l'enveloppe (invitation complète)">

<!-- ================= ÉCRAN 1 : LA MISSION SECRÈTE ================= -->
<section class="gate" id="gate" aria-label="Ouverture de l'invitation">
  <img loading="lazy" decoding="async" class="gate-fill" src="" data-scene alt="" aria-hidden="true">
  <div class="stage">
    <img loading="lazy" decoding="async" class="layer" src="" data-scene alt="" aria-hidden="true">
    <div class="env-glow" aria-hidden="true"></div>
    <div class="env-shadow" aria-hidden="true"></div>
    <div class="env-float">
      <div class="layer env-inside" aria-hidden="true"></div>
      <div class="peek" aria-hidden="true">
        <img loading="lazy" decoding="async" class="peek-tex" src="/media/x/8c60b5be182d38.webp" alt="">
        <span class="comic" data-namesize="peek" style="position: relative; font-size: 14cqw; line-height: .95; color: #E62429; -webkit-text-stroke: .4cqw #111; paint-order: stroke fill; text-shadow: .6cqw .6cqw 0 #0057B8"><span data-w="child"></span></span>
        <span class="comic" style="position: relative; margin-top: 1cqw; font-size: 6cqw; line-height: 1; color: #101D3A">fête ses <span data-w="age"></span> ans !</span>
      </div>
      <img loading="lazy" decoding="async" class="layer env-body" src="" data-scene alt="" aria-hidden="true">
      <div class="flap" aria-hidden="true">
        <div class="flap-back"></div>
        <img loading="lazy" decoding="async" class="layer flap-front" src="" data-scene alt="">
      </div>

  var pad = function (n) { return String(n).padStart(2, '0'); };

  var place = [C.venue, C.address].filter(Boolean).join(', '), q = C.mapQuery || place;

    btn.querySelector('span').textContent = v === 'no' ? FIXED.sendNo : FIXED.sendYes;
  }
  yes.addEventListener('click', function () { choose('yes'); });
  no.addEventListener('click', function () { choose('no'); });
  $('#f-name').addEventListener('input', function () { setErr(''); });
  btn.addEventListener('click', function () {
    if (sent) return;
    if (!rsvp) { setErr("Choisis d'abord ta réponse : oui ou non ?"); return; }
    var name = $('#f-name').value.trim();
    if (name.length < 2) { setErr("N'oublie pas d'écrire ton nom et ton prénom !"); return; }
    var id = Math.random().toString(36).slice(2), done = false, label = btn.querySelector('span').textContent;
    btn.disabled = true; btn.querySelector('span').textContent = 'Envoi…';
    function finish(ok, msg) {
      if (done) return; done = true; removeEventListener('message', on);
      if (ok) { sent = true; $('#okTitle').textContent = (rsvp === 'no' ? FIXED.okNo : FIXED.okYes) + name + ' !'; $('#okBox').hidden = false; btn.querySelector('span').textContent = '✓ Réponse envoyée'; }
      else { btn.disabled = false; btn.querySelector('span').textContent = label; setErr(msg || "La réponse n'a pas pu être envoyée. Réessaie."); }
    }
    function on(e) { var m = e.data; if (m && m.type === 'farha:rsvp-result' && m.id === id) finish(m.ok, m.error); }
    addEventListener('message', on);
    if (window.parent === window) { finish(true); return; }
    try { parent.postMessage({ type: 'farha:rsvp', id: id, name: name, attending: rsvp === 'yes', message: $('#f-msg').value.trim().slice(0, 600) }, '*'); } catch (e) {}
    setTimeout(function () { finish(true); }, 15000);
  });
})();

</script>
</body>
</html>
