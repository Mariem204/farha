<style>
body{margin:0;background:#f7efe2}
a{color:#6e2227}a:hover{color:#4f1519}
.ar{font-family:'Aref Ruqaa',serif;color:#6e2227}
.bd{font-family:'Amiri',serif;color:#4a2a1c}
.lb{font-family:'Amiri',serif;font-weight:700;color:#7a5a1e}
.fld{width:100%;box-sizing:border-box;border:1px solid #c9a769;border-radius:6px;background:#fffaf1;padding:8px 12px;font-family:'Amiri',serif;font-size:17px;color:#4a2a1c}
.fld:focus{outline:2px solid #8a6426;outline-offset:1px}
.opt{position:relative;flex:1;display:flex;align-items:center;justify-content:center;gap:7px;min-height:44px;box-sizing:border-box;padding:6px 6px;border:1px solid #c9a769;border-radius:6px;background:#fffaf1;font-family:'Amiri',serif;font-weight:700;font-size:15px;color:#6e2227;cursor:pointer;white-space:nowrap}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt:focus-within{outline:2px solid #8a6426;outline-offset:1px}
.opt.on{background:#f3e3c4;border-color:#6e2227}
.opt .rd{flex:none;width:14px;height:14px;box-sizing:border-box;border-radius:50%;border:1px solid #a8843f;background:#fffaf1}
.opt.on .rd{border:5px solid #6e2227}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;min-width:150px;padding:0 24px;border:1px solid #4f1519;border-radius:4px;background:#6e2227;color:#fbf1dc;font-family:'Amiri',serif;font-weight:700;font-size:18px;text-decoration:none;cursor:pointer;box-shadow:inset 0 0 0 3px #6e2227,inset 0 0 0 4px rgba(226,190,120,.7)}
.btn:hover{background:#571a1e;color:#fff;box-shadow:inset 0 0 0 3px #571a1e,inset 0 0 0 4px rgba(226,190,120,.7)}
.sw{display:flex;flex-direction:column;align-items:center;gap:4px}
.sw span.c{width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 2px #f7efe2,0 0 0 3px #a8843f}
.swing{transform-origin:50% 3%;animation:swing 6.5s ease-in-out 2.4s infinite alternate}
@keyframes swing{from{transform:rotate(-2.6deg)}to{transform:rotate(2.6deg)}}
.halo{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,228,160,.62),rgba(255,228,160,0) 70%);pointer-events:none;animation:flick 3.4s ease-in-out infinite alternate}
@keyframes flick{from{opacity:.55;transform:scale(.94)}to{opacity:1;transform:scale(1.06)}}
.shine{background:linear-gradient(100deg,#6e2227 0,#6e2227 42%,#c9a23f 50%,#6e2227 58%,#6e2227 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s ease-in-out 2.6s infinite}
@keyframes shine{0%{background-position:170% 0}50%,100%{background-position:-70% 0}}
.pin{animation:pinb 2.6s ease-in-out infinite}
@keyframes pinb{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.jas{position:absolute;pointer-events:none;opacity:0;animation:jasFall 17s linear infinite}
@keyframes jasFall{0%{transform:translate(0,-24px) rotate(0deg);opacity:0}9%{opacity:.9}52%{transform:translate(26px,420px) rotate(170deg)}91%{opacity:.75}100%{transform:translate(-12px,840px) rotate(348deg);opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.55) translateY(16px)}to{opacity:1;transform:none}}
@keyframes ornIn{from{opacity:0;transform:scaleX(.45)}to{opacity:1;transform:none}}
.fade{animation:fadeUp 1.2s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rvUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@supports (animation-timeline: view()){
.rv > *{animation:rvUp linear both;animation-timeline:view();animation-range:entry 5% entry 55%}
.rv > *:nth-child(2){animation-range:entry 12% entry 62%}
.rv > *:nth-child(3){animation-range:entry 19% entry 69%}
.rv > *:nth-child(4){animation-range:entry 26% entry 76%}
.rv > *:nth-child(n+5){animation-range:entry 33% entry 83%}
.rv1{animation:rvUp linear both;animation-timeline:view();animation-range:entry 5% entry 60%}
.ornIn{animation:ornIn linear both;animation-timeline:view();animation-range:entry 8% entry 58%}
.sw{animation:pop linear both;animation-timeline:view();animation-range:entry 12% entry 62%}
.sw:nth-child(2){animation-range:entry 18% entry 68%}
.sw:nth-child(3){animation-range:entry 24% entry 74%}
.sw:nth-child(4){animation-range:entry 30% entry 80%}
.sw:nth-child(5){animation-range:entry 36% entry 86%}
}
@media (prefers-reduced-motion: reduce){.fade,.rv > *,.rv1,.ornIn,.sw,.swing,.halo,.shine,.pin{animation:none !important}.jas{display:none}.shine{color:#6e2227;-webkit-text-fill-color:#6e2227}}

[hidden]{display:none!important}
html,body{margin:0;background:#f7efe2;overflow-x:hidden}
#wrap{position:relative;margin:0 auto;overflow:hidden}
#root{transform-origin:0 0}
</style>

  all('[data-maps]').forEach(function (a) { a.href = maps; });
  // couleurs de la tenue : si une couleur est changée, son nom (خمري، أسود…) n'est plus juste et se cache
  function toHex(c) { var m = String(c).match(/[\d.]+/g); return m && m.length >= 3 ? '#' + m.slice(0, 3).map(function (x) { return ('0' + Math.round(+x).toString(16)).slice(-2); }).join('') : ''; }
  var sws = all('#swatches .swatch');
  function names() { sws.forEach(function (s) { var n = s.nextElementSibling, cur = toHex(getComputedStyle(s).backgroundColor); if (n) n.style.visibility = (!cur || cur === s.getAttribute('data-def')) ? '' : 'hidden'; }); }
  try { new MutationObserver(names).observe($('#swatches'), { attributes: true, subtree: true, attributeFilter: ['style'] }); } catch (e) {}
  names();
  // choix « إي / ما نجّمش »
  var form = $('#rsvpForm'), opts = all('#rsvpForm .opt');
  opts.forEach(function (l) { l.querySelector('input').addEventListener('change', function () { opts.forEach(function (o) { o.classList.toggle('on', o.querySelector('input').checked); }); }); });
  // réponse : envoyée au site Farha, qui la transmet par e-mail
  var sending = false;
  form.addEventListener('submit', function (ev) {
    ev.preventDefault(); if (sending) return;
    var name = $('#rsvp-name').value.trim(), msg = $('#rsvp-msg').value.trim(), att = (form.querySelector('input[name=att]:checked') || {}).value;
    var err = $('#rsvpErr'); err.hidden = true;
    if (!name || !att || !msg) { err.textContent = 'عمّر الاسم، اختار إذا باش تجي، واكتب كلمة للعروسة.'; err.hidden = false; return; }
    var id = Math.random().toString(36).slice(2), done = false, btn = $('#rsvpBtn');
    sending = true; btn.textContent = '…';
    function finish(okk, e) {
      if (done) return; done = true; removeEventListener('message', on); sending = false; btn.textContent = 'ابعث';
      if (okk) {
        $('#rsvpGuest').textContent = name;
        $('#rsvpReply').textContent = att === 'no' ? 'توحّشناك، ويعيّشك على كلمتك الحلوة' : 'نستنّاو فيك بكل فرح';
        form.hidden = true; $('#rsvpSent').hidden = false;
      } else { err.textContent = e || 'ما نجّمناش نبعثو الرد. ثبّت في الكونكسيون وعاود.'; err.hidden = false; }
    }
    function on(e) { var x = e.data; if (x && x.type === 'farha:rsvp-result' && x.id === id) finish(x.ok, x.error); }
    addEventListener('message', on);
    if (window.parent === window) { finish(true); return; }
    try { parent.postMessage({ type: 'farha:rsvp', id: id, name: name, attending: att === 'yes', message: msg.slice(0, 560) }, '*'); } catch (e) {}
    setTimeout(function () { finish(true); }, 15000);
  });
})();
</script>
</body>
</html>
