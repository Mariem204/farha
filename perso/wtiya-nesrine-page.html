le.transition = 'opacity .85s ease, transform .85s ease';\n        el.style.willChange = 'opacity, transform';\n        const r = el.getBoundingClientRect();\n        if (r.top < window.innerHeight * 0.95) return;\n        el.style.opacity = '0';\n        el.style.transform = 'translateY(22px)';\n        el.dataset.rv = '1';\n      });\n      const io = new IntersectionObserver(function (entries) {\n        entries.forEach(function (e) {\n          if (!e.isIntersecting) return;\n          const el = e.target;\n          const d = (el.dataset.rvi ? parseInt(el.dataset.rvi, 10) : 0) * 110;\n          setTimeout(function () {\n            el.style.opacity = '1';\n            el.style.transform = 'none';\n          }, d);\n          io.unobserve(el);\n        });\n      }, { threshold: 0.01, rootMargin: '0px 0px -22% 0px' });\n      secs.forEach(function (sec, si) {\n        if (si === 0) return;\n        let k = 0;\n        Array.prototype.slice.call(sec.children).forEach(function (el) {\n          if (items.indexOf(el) === -1) return;\n          el.dataset.rvi = String(k++);\n          io.observe(el);\n        });\n      });\n      dividers.forEach(function (d) { io.observe(d); });\n    } catch (e) {}\n  }\n\n  renderVals() {\n    const st = this.state || {};\n    const iso = this.props.eventISO || '2027-08-26T18:00:00';\n    const d = new Date(iso);\n    const base = Number.isNaN(d.getTime()) ? new Date() : d;\n    const months = ['\u062c\u0627\u0646\u0641\u064a','\u0641\u064a\u0641\u0631\u064a','\u0645\u0627\u0631\u0633','\u0623\u0641\u0631\u064a\u0644','\u0645\u0627\u064a','\u062c\u0648\u0627\u0646','\u062c\u0648\u064a\u0644\u064a\u0629','\u0623\u0648\u062a','\u0633\u0628\u062a\u0645\u0628\u0631','\u0623\u0643\u062a\u0648\u0628\u0631','\u0646\u0648\u0641\u0645\u0628\u0631','\u062f\u064a\u0633\u0645\u0628\u0631'];\n    const y = base.getFullYear();\n    const m = base.getMonth();\n    const lead = new Date(y, m, 1).getDay();\n    const days = new Date(y, m + 1, 0).getDate();\n    const cells = [];\n    for (let i = 0; i < 42; i++) {\n      const n = i - lead + 1;\n      const inMonth = n >= 1 && n <= days;\n      const isDay = inMonth && n === base.getDate();\n      cells.push({ n: inMonth ? String(n) : '', cls: isDay ? 'cal on' : (inMonth ? 'cal' : 'cal off') });\n    }\n    const p2 = (v) => String(v).padStart(2, '0');\n    const stamp = (dt) => dt.getUTCFullYear() + p2(dt.getUTCMonth() + 1) + p2(dt.getUTCDate()) + 'T' + p2(dt.getUTCHours()) + p2(dt.getUTCMinutes()) + '00Z';\n    const end = new Date(base.getTime() + 5 * 3600 * 1000);\n    const gcalUrl = 'https://calendar.google.com/calendar/render?action=TEMPLATE'\n      + '&text=' + encodeURIComponent('\u0648\u0637\u064a\u0629 \u0646\u0633\u0631\u064a\u0646')\n      + '&dates=' + stamp(base) + '/' + stamp(end);\n\n    return {\n      musicOn: !!st.music,\n      musicOff: !st.music,\n      musicLabel: st.music ? '\u0623\u0648\u0642\u0641 \u0627\u0644\u0645\u0648\u0633\u064a\u0642\u0649' : '\u0634\u063a\u0651\u0644 \u0627\u0644\u0645\u0648\u0633\u064a\u0642\u0649',\n      toggleMusic: () => {\n        const el = document.getElementById('bgm');\n        if (!el) { this.setState({ music: !st.music }); return; }\n        if (el.paused) { el.volume = 0.8; const pr = el.play(); if (pr && pr.catch) pr.catch(() => {}); this.setState({ music: true }); }\n        else { el.pause(); this.setState({ music: false }); }\n      },\n      gcalUrl: gcalUrl,\n      monthName: months[m], year: String(y), cells: cells,\n      yesClass: st.rep === 'yes' ? 'opt on' : 'opt',\n      noClass: st.rep === 'no' ? 'opt no on' : 'opt no',\n      pickYes: () => this.setState({ rep: 'yes' }),\n      pickNo: () => this.setState({ rep: 'no' }),\n      onName: (e) => this.setState({ name: e.target.value }),\n      onMsg: (e) => this.setState({ msg: e.target.value }),\n      submit: (e) => {\n        if (e && e.preventDefault) e.preventDefault();\n        const nm = (st.name || '').trim() || '\u0636\u064a\u0641';\n        const rep = st.rep === 'no' ? '\u0645\u0627 \u0646\u062c\u0645\u0634 \u0646\u062c\u064a' : '\u0646\u0639\u0645 \u0628\u0625\u0630\u0646 \u0627\u0644\u0644\u0647';\n        const msg = (st.msg || '').trim();\n        const subject = '\u062a\u0623\u0643\u064a\u062f \u062d\u0636\u0648\u0631 \u2014 \u0648\u0637\u064a\u0629 \u0646\u0633\u0631\u064a\u0646 : ' + nm;\n        const body = '\u0627\u0644\u0627\u0633\u0645: ' + nm + '\\n\u0627\u0644\u0625\u062c\u0627\u0628\u0629: ' + rep + '\\n\u0643\u0644\u0645\u0629 \u0644\u0644\u0639\u0631\u0648\u0633\u0629: ' + (msg || '\u2014');\n        const url = 'mailto:maryemayadi05@gmail.com?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);\n        try { window.location.href = url; } catch (err) {}\n        this.setState({ sent: true });\n      },\n      notSent: !st.sent,\n      sent: !!st.sent,\n      guest: st.name || '',\n      reply: st.rep === 'no'\n        ? '\u0628\u0627\u0634 \u062a\u0646\u0642\u0635\u0648\u0646\u0627 \u2014 \u0634\u0643\u0631\u0627 \u0639\u0644\u0649 \u0631\u062f\u0643\u0645.'\n        : '\u0628\u0644\u0627\u0635\u062a\u0643\u0645 \u0645\u062d\u062c\u0648\u0632\u0629\u060c \u0646\u0633\u062a\u0646\u0627\u0648\u0643\u0645.'\n    };\n  }\n}\n<\/script>\n\n\n<\/body><\/html>"</script>
